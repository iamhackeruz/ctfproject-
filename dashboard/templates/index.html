<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Corp CTF v2 — Kirish va Ro'yxatdan o'tish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #050811;
            --card-dark: #0c1222;
            --neon-green: #00ff88;
            --neon-cyan: #00f2fe;
            --neon-orange: #ff9900;
            --border-glow: rgba(0, 242, 254, 0.25);
        }
        body {
            background-color: var(--bg-body);
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .main-card {
            background: linear-gradient(135deg, rgba(12, 18, 34, 0.95), rgba(18, 28, 52, 0.95));
            border: 1px solid var(--border-glow);
            border-radius: 18px;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }
        .title-glow {
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-tabs {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-tabs .nav-link {
            color: #94a3b8;
            border: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
        }
        .nav-tabs .nav-link.active {
            color: var(--neon-cyan);
            background: transparent;
            border-bottom: 2px solid var(--neon-cyan);
        }
        .form-control {
            background-color: rgba(5, 8, 17, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.25);
            color: #fff;
            padding: 12px 14px;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: #050811;
            border-color: var(--neon-cyan);
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .btn-cyber {
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            color: #050811;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }
        .btn-cyber:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            color: #050811;
        }
        .quick-links {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }
        .quick-btn {
            background: rgba(12, 18, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            flex: 1;
            justify-content: center;
        }
        .quick-btn:hover {
            border-color: var(--neon-cyan);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="text-center mb-4">
            <div class="fs-1 text-info mb-1"><i class="fas fa-shield-virus"></i></div>
            <h3 class="title-glow mb-1">APEX CORP CTF v2</h3>
            <p class="text-muted small mb-0">Professional Kiberxavfsizlik Arenasi</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">
            <i class="fas fa-exclamation-triangle me-1"></i> {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success py-2 small" role="alert">
            <i class="fas fa-check-circle me-1"></i> {{ success }}
        </div>
        {% endif %}

        <!-- Tablar: Kirish va Ro'yxatdan o'tish -->
        <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link {% if active_tab != 'register' %}active{% endif %}" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button">
                    <i class="fas fa-sign-in-alt me-1"></i> Kirish
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link {% if active_tab == 'register' %}active{% endif %}" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button">
                    <i class="fas fa-user-plus me-1"></i> Ro'yxatdan o'tish
                </button>
            </li>
        </ul>

        <div class="tab-content" id="authTabContent">
            <!-- 1. KIRISH (LOGIN) -->
            <div class="tab-pane fade {% if active_tab != 'register' %}show active{% endif %}" id="login-pane">
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label small text-muted">Foydalanuvchi nomi (Username)</label>
                        <input type="text" name="username" class="form-control" placeholder="ali_valiyev" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-muted">Parol</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-cyber w-100">
                        <i class="fas fa-arrow-right-to-bracket me-1"></i> Shaxsiy Kabinetga Kirish
                    </button>
                </form>
            </div>

            <!-- 2. RO'YXATDAN O'TISH (REGISTER) -->
            <div class="tab-pane fade {% if active_tab == 'register' %}show active{% endif %}" id="register-pane">
                <form method="POST" action="/register">
                    <div class="mb-3">
                        <label class="form-label small text-muted">Ism va Familiya</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Ali Valiyev" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Username (Lotin harflarida)</label>
                        <input type="text" name="username" class="form-control" placeholder="ali_valiyev" pattern="[a-zA-Z0-9_]+" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Parol</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="4" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-muted">Parolni tasdiqlang</label>
                        <input type="password" name="password_confirm" class="form-control" placeholder="••••••••" minlength="4" required>
                    </div>
                    <button type="submit" class="btn btn-cyber w-100">
                        <i class="fas fa-key me-1"></i> Ro'yxatdan o'tish va Token olish
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Tezkor o'tish havolasi: Faqat Jonli Matritsa -->
    <div class="quick-links">
        <a href="/matrix" class="quick-btn">
            <i class="fas fa-tv text-info"></i>
            <span>Katta Ekran (Jonli Hujum Matritsasi)</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
