# ==============================================================================
# CyberEdu Platform — Nginx Production Reverse Proxy Konfiguratsiyasi
# TLS 1.2+, HSTS, Xavfsizlik sarlavhalari va Cookie izolyatsiyasi
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # SSL global sozlamalari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 1. HTTP -> HTTPS Avtomatik qayta yo'naltirish
    server {
        listen 80;
        listen [::]:80;
        server_name cyberedu.uz labs.cyberedu.uz;
        return 301 https://$host$request_uri;
    }

    # 2. ASOSIY TA'LIM PLATFORMASI (https://cyberedu.uz)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name cyberedu.uz;

        ssl_certificate /etc/letsencrypt/live/cyberedu.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cyberedu.uz/privkey.pem;

        # Xavfsizlik sarlavhalari
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

        client_max_body_size 10M;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # 3. IZOLYATSIYA QILINGAN VEB-LABORATORIYALAR (https://labs.cyberedu.uz)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name labs.cyberedu.uz;

        ssl_certificate /etc/letsencrypt/live/labs.cyberedu.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/labs.cyberedu.uz/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 5M;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # KRITIK: Platforma cookie'larini subdomendan qat'iy olib tashlash
            proxy_set_header Cookie "";
        }
    }
}
