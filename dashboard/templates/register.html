<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — Apex Corp CTF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #050811;
            --card-dark: #0c1222;
            --neon-green: #00ff88;
            --neon-cyan: #00f2fe;
            --border-glow: rgba(0, 242, 254, 0.25);
        }
        body {
            background-color: var(--bg-body);
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: linear-gradient(135deg, rgba(12, 18, 34, 0.95), rgba(18, 28, 52, 0.95));
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15);
            width: 100%;
            max-width: 480px;
            padding: 35px;
        }
        .title-glow {
            font-weight: 800;
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-control {
            background-color: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.25);
            color: #fff;
            padding: 12px 14px;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: rgba(5, 8, 17, 0.95);
            border-color: var(--neon-cyan);
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .btn-cyber {
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            color: #050811;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }
        .btn-cyber:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            color: #050811;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <div class="fs-1 text-info mb-2"><i class="fas fa-shield-halved"></i></div>
        <h3 class="title-glow">APEX CORP CTF v2</h3>
        <p class="text-muted small">Yangi ishtirokchi ro'yxatdan o'tishi</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">
        <i class="fas fa-exclamation-triangle me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/register">
        <div class="mb-3">
            <label class="form-label small text-muted">Ism va Familiya</label>
            <input type="text" name="full_name" class="form-control" placeholder="Ali Valiyev" required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label small text-muted">Foydalanuvchi nomi (Username)</label>
            <input type="text" name="username" class="form-control" placeholder="ali_valiyev" pattern="[a-zA-Z0-9_]+" title="Faqat harflar, raqamlar va pastki chiziq" required>
            <div class="form-text text-muted" style="font-size: 0.75rem;">Faqat lotin harflari va raqamlar.</div>
        </div>

        <div class="mb-3">
            <label class="form-label small text-muted">Parol</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="4" required>
        </div>

        <div class="mb-4">
            <label class="form-label small text-muted">Parolni tasdiqlang</label>
            <input type="password" name="password_confirm" class="form-control" placeholder="••••••••" minlength="4" required>
        </div>

        <button type="submit" class="btn btn-cyber w-100 mb-3">
            <i class="fas fa-user-plus me-1"></i> Ro'yxatdan o'tish va Token olish
        </button>

        <div class="text-center small text-muted">
            Allaqachon ro'yxatdan o'tganmisiz?
            <a href="/login" class="text-info text-decoration-none fw-semibold">Tizimga kirish</a>
        </div>
        <div class="text-center mt-3 small">
            <a href="/" class="text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Jonli Matritsaga qaytish</a>
        </div>
    </form>
</div>

</body>
</html>
